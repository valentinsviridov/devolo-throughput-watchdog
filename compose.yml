services:
  devolo-watchdog:
    build: .
    network_mode: host
    restart: unless-stopped
    read_only: true
    stop_grace_period: 30s
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - devolo-throughput-watchdog.env
    environment:
      - DW_STATE_FILE=/var/lib/devolo-watchdog/state.json
      - DW_HEARTBEAT_FILE=/tmp/watchdog_heartbeat
      - DW_LOG_FORMAT=json
      - DW_HTTP_PORT=61495
    volumes:
      - devolo-state:/var/lib/devolo-watchdog
      # Uncomment if using password file authentication:
      # - /etc/devolo-throughput-watchdog.password:/etc/devolo-throughput-watchdog.password:ro
      # Uncomment if using authenticated ntfy publishing:
      # - /etc/devolo-watchdog-ntfy-token:/run/secrets/devolo-watchdog-ntfy-token:ro

volumes:
  devolo-state:
